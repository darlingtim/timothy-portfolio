<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="googleBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#34A853" />
      <stop offset="66%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="url(#certBg)" />
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-opacity="0.6" />
  <!-- Inner Border -->
  <rect x="36" y="36" width="728" height="488" rx="8" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Accent Header Bar -->
  <rect x="36" y="36" width="728" height="6" rx="3" fill="url(#googleBlue)" />

  <!-- Issuer -->
  <g transform="translate(400, 100)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#38bdf8" text-transform="uppercase">OFFICIAL PROFESSIONAL CERTIFICATE</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#f8fafc">Google IT Support Professional</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" y="30">Authorized by Google and offered through Coursera</text>
  </g>

  <!-- Recipient Section -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" font-style="italic">This is to certify that</text>
    <text font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#fbbf24" y="44">Timothy Ododo</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" y="76">has successfully completed all five specialized IT professional courses</text>
  </g>

  <!-- Skills Ribbon -->
  <g transform="translate(400, 390)" text-anchor="middle">
    <rect x="-300" y="-18" width="600" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" y="5">
      Computer Networking • System Administration • IT Security • Linux/Windows CLI
    </text>
  </g>

  <!-- Footer Verification Badge -->
  <g transform="translate(100, 480)">
    <circle cx="20" cy="0" r="16" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M12 -2 L18 4 L28 -6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Verified Credential</text>
    <text x="46" y="12" font-family="monospace" font-size="10" fill="#64748b">ID: GOOGLE-IT-2024-ODODO</text>
  </g>

  <!-- Seal Badge on right -->
  <g transform="translate(700, 475)">
    <circle cx="0" cy="0" r="28" fill="#d97706" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2" />
    <text text-anchor="middle" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">GOOGLE</text>
  </g>
</svg>
