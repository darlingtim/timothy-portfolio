<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="rpiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e1b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rpiRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c51a4a" />
      <stop offset="100%" stop-color="#e0245e" />
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="url(#rpiBg)" />
  
  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="none" stroke="url(#emeraldBorder)" stroke-width="2" stroke-opacity="0.6" />
  <rect x="36" y="36" width="728" height="488" rx="8" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Top Accent Bar -->
  <rect x="36" y="36" width="728" height="6" rx="3" fill="url(#rpiRed)" />

  <!-- Header -->
  <g transform="translate(400, 100)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#34d399" text-transform="uppercase">RASPBERRY PI FOUNDATION ACCREDITATION</text>
  </g>

  <!-- Title -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#f8fafc">Certified Physical Computing Educator</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" y="30">Physical Computing, Microcontrollers &amp; STEM Pedagogy</text>
  </g>

  <!-- Recipient Section -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" font-style="italic">Awarded with distinction to</text>
    <text font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#34d399" y="44">Timothy Ododo</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" y="76">for excellence in teaching microcomputing with Raspberry Pi Pico &amp; MicroPython</text>
  </g>

  <!-- Skills Ribbon -->
  <g transform="translate(400, 390)" text-anchor="middle">
    <rect x="-290" y="-18" width="580" height="36" rx="8" fill="#0f291e" stroke="#059669" stroke-width="1" stroke-opacity="0.4" />
    <text font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" y="5">
      Raspberry Pi Pico • MicroPython • GPIO Prototyping • Sensor Systems
    </text>
  </g>

  <!-- Footer Verification -->
  <g transform="translate(100, 480)">
    <circle cx="20" cy="0" r="16" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M12 -2 L18 4 L28 -6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Certified Educator</text>
    <text x="46" y="12" font-family="monospace" font-size="10" fill="#64748b">ID: RPI-EDU-2024-ODODO</text>
  </g>

  <!-- Seal -->
  <g transform="translate(700, 475)">
    <circle cx="0" cy="0" r="28" fill="#e0245e" fill-opacity="0.15" stroke="#e0245e" stroke-width="2" />
    <text text-anchor="middle" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fda4af">RPI STEM</text>
  </g>
</svg>
