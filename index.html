    <script>
      (function() {
        document.documentElement.classList.add('dark');
        try {
          var stored = localStorage.getItem('theme_preference');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
