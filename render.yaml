# Render Blueprint Specification for Timothy Ododo Portfolio
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: timothy-portfolio
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: CONTACT_EMAIL
        value: timothyododo@gmail.com
      - key: CONTENT_DIR
        value: content
